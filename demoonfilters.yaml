- name : demo for filters
  connection: local
  hosts: local
  vars:
    items: linux,shell,ansible,teraform
    name:
    - krishna
    - sai
    - ch
    letter: ANSIBLE
    letters: ansible
  tasks:
    - name: filters check
      debug:
        msg: this is filter {{ user | default('kittu') }}
    - name : we convert items from string to list
      debug:
        msg: this is filter we use {{items | split()}}
    - name: we convert items from list to string
      debug:
        msg: this is filter we use {{name | join(' ')}}
    - name: we convert items from upper letters to lower letters
      debug:
        msg: this is filter we use {{letter | lower}}
    - name: we convert items from lower letters to upper letters
      debug:
        msg: this is filter we use {{letter | upper}}

        
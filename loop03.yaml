- name : install packages 
  hosts: local
  connection: local
  become: yes
  vars:
   packages:
    - {name: nginx , state: absent}
    - {name: httpd , state: absent}
    - {name: htop , state: absent}
    - {name: git , state: absent}
    - {name: top , state: present}
  tasks:
    - name: install package
      package:
         name: "{{item.name}}"
         state: "{{item.state}}"
      loop: "{{packages}}"
  #Easy rule: use {{ ... }} to insert a variable; use quotes to mark text; use single { ... } only for compact YAML data. In your package list, the compact entries are valid, and {{ item.name }} later reads the name value from each entry.
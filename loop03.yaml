- name : install packages 
  hosts: local
  connection: local
  become: yes
  vars:
   packages:
    - "{{name: nginx , state: absent}}"
    - "{{name: httpd , state: absent}}"
    - "{{name: htop , state: absent}}"
    - "{{name: git , state: absent}}"
    - "{{name: top , state: present}}"
  tasks:
    - name: install package
      package:
         name: "{{item.name}}"
         state: "{{item.state}}"
      loop: "{{packages}}"
- name : learning conditions
  connection: local
  hosts: local
  tasks:
    - name: we get info from gatherings
      debug: 
        msg: this os is from Redhat
      when: ansible_facts.os_family == "RedHat"
    - name: we have some info from grthrings
      debug:
        msg: this is debian famly
      when: ansible_facts.os_family == "Debian"
- name: just check the modue
  connection: local
  become: yes
  hosts: local
  tasks:
    - name: "checking the nginx in redhat"
      dnf:
        state: present
        name: nginx
      when: ansible_facts.os_family == "RedHat"
    - name: "checking the nginx in debian famly"
      apt:
        state: present
        name: nginx
      when: ansible_facts.os_family == "Debian"

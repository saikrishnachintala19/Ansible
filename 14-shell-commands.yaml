- name: shell vs command
  connection: local
  hosts: local
  tasks:
  - name: test command module
    #command: cat /etc/passwd | grep ec2-user
    shell: cat /etc/passwd | grep ec2-user
    register: cpmmand_output
  - name: print that output
    debug:
     msg: "{{cpmmand_output}}"
  - name: use redirection
    #command: ll -a > /tmp/tmp.txt
    shell: ls -a > /tmp/tmp.txt
    register: redirection_output
  - name: printing redirection output
    debug:
      msg: "{{ redirection_output }}"